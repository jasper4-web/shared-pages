<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Congratulations!</title>
<meta name="theme-color" content="#160733">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0d0424 radial-gradient(130% 100% at 50% 38%, #5a22b8 0%, #2a0d5e 42%, #0d0424 100%) fixed;
    color:#fff; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,"Arial Black",sans-serif;
    -webkit-tap-highlight-color:transparent; touch-action:none;
    -webkit-user-select:none; user-select:none; cursor:pointer;
  }
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    perspective:800px;perspective-origin:50% 45%;z-index:2}
  h1{font-size:100px;font-weight:900;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;
    display:flex;transform-style:preserve-3d;will-change:transform}
  /* .l = one letter (entrance + tap flip) > .w = the wave > .k depth layers + .f the face */
  .l{display:inline-block;position:relative;transform-style:preserve-3d;
    animation:enter 1.1s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i) * 55ms + 150ms)}
  .w{display:block;position:relative;transform-style:preserve-3d;
    animation:wave 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * -0.14s)}
  .k{position:absolute;left:0;top:0;transform:translateZ(calc(var(--d) * -0.022em));
    color:hsl(var(--h) 90% calc(58% - var(--d) * 3.6%))}
  .f{display:block;position:relative;color:#fff8dc;text-shadow:0 0 .18em hsl(var(--h) 100% 70% / .75)}
  @keyframes enter{
    from{opacity:0;transform:translateY(1.2em) translateZ(-600px) rotateX(-110deg)}
    to{opacity:1;transform:none}
  }
  @keyframes wave{
    0%,100%{transform:translateY(0) translateZ(0) rotateY(0deg)}
    25%{transform:translateY(-.14em) translateZ(.45em) rotateY(-16deg)}
    50%{transform:translateY(0) translateZ(0) rotateY(0deg)}
    75%{transform:translateY(.05em) translateZ(-.1em) rotateY(12deg)}
  }
  @keyframes flip{
    from{transform:rotateX(0deg)}
    to{transform:rotateX(360deg)}
  }
  .hint{margin-top:2.2em;font-size:15px;font-weight:600;letter-spacing:.08em;color:#e9dcff;
    opacity:0;animation:fadein 1s 2.4s forwards}
  .hint.gone{animation:none;opacity:0;transition:opacity .5s}
  @keyframes fadein{to{opacity:.7}}
  @media (prefers-reduced-motion:reduce){ .w{animation:none} .l{animation-duration:.01s} }
</style>
</head>
<body>
<div class="stage">
  <h1 id="word" aria-label="Congratulations"></h1>
  <p class="hint" id="hint" aria-hidden="true">tap anywhere ✨</p>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
(() => {
  const WORD = "Congratulations", LAYERS = 10;
  const h1 = document.getElementById("word"), hint = document.getElementById("hint");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Build each letter as a stack: depth layers behind a bright face.
  const letters = [...WORD].map((ch, i) => {
    const l = document.createElement("span"), w = document.createElement("span");
    l.className = "l"; w.className = "w";
    l.setAttribute("aria-hidden", "true");
    l.style.setProperty("--i", i);
    l.style.setProperty("--h", (300 + i * 24) % 360);
    for (let d = LAYERS; d >= 1; d--) {
      const k = document.createElement("span");
      k.className = "k"; k.style.setProperty("--d", d); k.textContent = ch;
      w.appendChild(k);
    }
    const f = document.createElement("span");
    f.className = "f"; f.textContent = ch;
    w.appendChild(f); l.appendChild(w); h1.appendChild(l);
    return l;
  });

  // Fit the word to the screen width on any device. The camera distance grows with the word,
  // so the near end never swings off the screen on a big monitor.
  const stage = document.querySelector(".stage");
  function fit() {
    h1.style.fontSize = "100px";
    const w = h1.scrollWidth || 1;
    const size = Math.max(24, Math.min(150, 100 * Math.min(innerWidth * 0.84, 1100) / w));
    h1.style.fontSize = size + "px";
    stage.style.perspective = Math.max(900, w * size / 100 * 2.4) + "px";
  }

  // Tilt toward the finger / mouse; drift gently on its own when idle.
  let tx = 0, ty = 0, rx = 0, ry = 0, lastMove = -1e9;
  addEventListener("pointermove", e => {
    ry = (e.clientX / innerWidth - 0.5) * 44;
    rx = -(e.clientY / innerHeight - 0.5) * 32;
    lastMove = performance.now();
  });

  // Confetti with a 3D flip (each piece squashes as it turns over).
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const COLORS = ["#ff3d7f", "#ffbe0b", "#3ae374", "#18dcff", "#7d5fff", "#ff9f1a", "#fffa65", "#ffffff"];
  const MAX = 700, P = [];
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fit();
  }
  function spawn(x, y, n, speed, spread, angle) {
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - 0.5) * spread, v = speed * (0.45 + Math.random() * 0.75);
      P.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 5,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        flip: Math.random() * 6.28, vf: 0.08 + Math.random() * 0.18,
        sw: Math.random() * 6.28, round: Math.random() < 0.22
      });
    }
    if (P.length > MAX) P.splice(0, P.length - MAX);
  }
  function cannons() {
    const s = Math.sqrt(H) * 0.62, n = reduce ? 30 : 110;
    spawn(0, H, n, s, 0.9, -Math.PI / 3);
    spawn(W, H, n, s, 0.9, -2 * Math.PI / 3);
  }

  function flipLetters() {
    letters.forEach((l, i) => {
      l.style.animation = "none";
      void l.offsetWidth;
      l.style.animation = `flip .9s cubic-bezier(.3,1.25,.5,1) ${i * 40}ms both`;
    });
  }

  window.__taps = 0;
  addEventListener("pointerdown", e => {
    window.__taps++;
    hint.classList.add("gone");
    spawn(e.clientX, e.clientY, reduce ? 25 : 80, 11, Math.PI * 2, 0);
    if (!reduce) flipLetters();
  });
  window.__confetti = () => P.length;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.67); last = now;

    if (now - lastMove > 2500) {
      ry = Math.sin(now / 1600) * 18;
      rx = Math.sin(now / 2300) * 8;
    }
    tx += (rx - tx) * 0.06 * dt; ty += (ry - ty) * 0.06 * dt;
    h1.style.transform = `rotateX(${tx.toFixed(2)}deg) rotateY(${ty.toFixed(2)}deg)`;

    if (!reduce && Math.random() < 0.55 * dt) {
      spawn(Math.random() * W, -20, 1, 1.5, 0.6, Math.PI / 2);
    }

    ctx.clearRect(0, 0, W, H);
    const drag = Math.pow(0.985, dt);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.vy = Math.min(p.vy + 0.18 * dt, 3.4); p.vx *= drag; p.vy *= drag;
      p.sw += 0.05 * dt;
      p.x += (p.vx + Math.sin(p.sw) * 0.6) * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
      if (p.y > H + 30 || p.x < -60 || p.x > W + 60) { P.splice(i, 1); continue; }
      const sy = Math.cos(p.flip);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, sy);
      ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h * 0.8, 0, 6.283); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      if (sy < 0) { // the back side of a piece is a touch darker
        ctx.fillStyle = "rgba(0,0,0,.28)";
        if (p.round) ctx.fill(); else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  setTimeout(cannons, 450);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
