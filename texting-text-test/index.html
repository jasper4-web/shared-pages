<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texting text</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #f5f5f5; } }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 0 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 14vw, 7rem);
    font-weight: 700;
    line-height: 1.1;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Texting text</h1>
</body>
</html>
