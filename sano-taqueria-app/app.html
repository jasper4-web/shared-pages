/* Layout: a phone-width owner app (max 440px, centered on wide screens) — sticky header, scrolling screen, fixed tab bar, bottom sheets.
   Cilantro green = go/done, chile red = needs you, masa amber = money pending; neutrals lean slightly green. */
:root {
  --bg: #eef2ef; --surface: #ffffff; --sunk: #f3f6f4; --line: #dfe5e1; --ink: #14201a; --soft: #5b6a62;
  --go: #1d6b45; --go-ink: #ffffff; --go-soft: #e3f3ea;
  --need: #c2410c; --need-soft: #fff1ea; --need-line: #f6cdb9;
  --money: #8a5a00; --money-soft: #fff5dc; --money-line: #efd79a;
  --alert: #b42318; --alert-soft: #fdecea;
  --link: #1f5fbf;
  --kds-bg: #0f1412; --kds-card: #1a221e; --kds-line: #2b3631; --kds-ink: #eef3f0; --kds-soft: #9aa8a0;
  --shadow: 0 8px 24px rgba(20, 32, 26, .12);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c110e; --surface: #151c18; --sunk: #1b241f; --line: #2a3530; --ink: #e9f0ec; --soft: #9aa9a1;
  --go: #2f9d66; --go-ink: #04140b; --go-soft: #15301f;
  --need: #f07b45; --need-soft: #2c1a12; --need-line: #5a2f1b;
  --money: #f0c159; --money-soft: #2a220f; --money-line: #5a4716;
  --alert: #ff8a7a; --alert-soft: #331614; --link: #7fb0ff;
  --shadow: 0 8px 24px rgba(0, 0, 0, .45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c110e; --surface: #151c18; --sunk: #1b241f; --line: #2a3530; --ink: #e9f0ec; --soft: #9aa9a1;
  --go: #2f9d66; --go-ink: #04140b; --go-soft: #15301f;
  --need: #f07b45; --need-soft: #2c1a12; --need-line: #5a2f1b;
  --money: #f0c159; --money-soft: #2a220f; --money-line: #5a4716;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -.01em; text-wrap: balance; margin: 0; }

.shell { max-width: 440px; margin: 0 auto; min-height: 100%; background: var(--bg); position: relative; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.demo { padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--soft); display: grid; gap: 7px; }
.demo .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.demo b { color: var(--ink); }
.seg { display: flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 7px 6px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

header.app { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; border-bottom: 1px solid var(--line); }

.status { text-align: right; display: grid; gap: 3px; justify-items: end; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12.5px; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.open { background: var(--go-soft); color: var(--go); }
.pill.paused { background: var(--money-soft); color: var(--money); }
.pill.off { background: var(--alert-soft); color: var(--alert); }
.conn { font-size: 11.5px; color: var(--soft); }

main { padding-block: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.label { font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; }
.label button { color: var(--link); font-weight: 700; letter-spacing: 0; text-transform: none; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; display: grid; gap: 4px; }

.card .t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-weight: 800; }
.card .t span:first-child { min-width: 0; }
.sub { font-size: 13px; color: var(--soft); }
.chip { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
.chip.ok { background: var(--go-soft); color: var(--go); }
.chip.due { background: var(--money-soft); color: var(--money); }
.chip.bad { background: var(--alert-soft); color: var(--alert); }
.chip.neutral { background: var(--sunk); color: var(--soft); }
.money { font-size: 13px; }
.money b { font-variant-numeric: tabular-nums; }
.allergy { background: var(--alert); color: var(--surface); font-weight: 800; border-radius: 10px; padding: 7px 10px; font-size: 13.5px; }

.needbar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--need); color: var(--surface); border-radius: 14px; padding: 11px 13px; font-weight: 800; font-size: 15px; }

.needbar.fine { background: var(--go-soft); color: var(--go); }

.need.money { border-left-color: var(--money); background: var(--money-soft); border-color: var(--money-line); }
.need .bd { flex: 1; min-width: 0; }

.need .sub { font-size: 12.5px; }
.act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font-weight: 800; font-size: 13.5px; border-radius: 10px; padding: 9px 12px; background: var(--ink); color: var(--surface); white-space: nowrap; }
.btn.go { background: var(--go); color: var(--go-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--alert-soft); color: var(--alert); }
.btn.big { font-size: 16px; padding: 13px 14px; border-radius: 12px; }
.btn.wide { width: 100%; text-align: center; }
.later { font-size: 12.5px; color: var(--soft); background: var(--sunk); border-radius: 11px; padding: 8px 10px; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--money-soft); border: 1px solid var(--money-line); color: var(--ink); border-radius: 12px; padding: 9px 10px; font-size: 12.5px; }
.notice .x { margin-left: auto; font-weight: 800; color: var(--soft); padding: 0 4px; }
.offline { background: var(--alert); color: var(--surface); border-radius: 12px; padding: 11px 12px; font-weight: 800; font-size: 14px; }
.offline small { display: block; font-weight: 600; opacity: .9; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 3px 0; }
.kv span { color: var(--soft); } .kv b { text-align: right; font-variant-numeric: tabular-nums; }
.kv.total { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 6px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meter { height: 7px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--need); }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 10px 11px; font: inherit; font-size: 14px; }
.list { display: grid; gap: 7px; }
.row2 { display: flex; gap: 8px; align-items: center; }
.row2 .bd { flex: 1; min-width: 0; }
.fab { position: fixed; z-index: 6; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc((100vw - 440px) / 2 + 16px)); background: var(--need); color: var(--surface); font-weight: 800; border-radius: 999px; padding: 13px 18px; box-shadow: var(--shadow); }

/* window mode (always dark: it lives next to a plancha) */
.kds { background: var(--kds-bg); color: var(--kds-ink); border-radius: 18px; padding: 12px; display: grid; gap: 10px; }
.kds .top { display: flex; gap: 6px; flex-wrap: wrap; }
.kds .k { font-size: 12.5px; font-weight: 800; border-radius: 10px; padding: 8px 10px; background: var(--kds-card); border: 1px solid var(--kds-line); color: var(--kds-ink); }
.kds .k.on { color: #8fe0ad; border-color: #1f5c36; }
.kds .k.p { color: #ffd77a; border-color: #8a6a12; }
.pace { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pace button { background: var(--kds-card); border: 1px solid var(--kds-line); color: var(--kds-soft); border-radius: 11px; padding: 9px 4px; font-weight: 800; font-size: 14px; }
.pace button small { display: block; font-weight: 600; font-size: 11px; }
.pace button[aria-pressed="true"] { color: #fff; border-color: #c2410c; background: #3a1d10; }
.tk { background: var(--kds-card); border: 2px solid var(--kds-line); border-radius: 16px; padding: 12px; display: grid; gap: 4px; }
.tk .a { display: flex; justify-content: space-between; color: var(--kds-soft); font-size: 14px; }
.tk .a b { color: #fff; font-size: 24px; font-family: var(--f-display); }

.tk .i { font-size: 20px; font-weight: 800; line-height: 1.2; }
.tk .mod { font-size: 17px; font-weight: 800; color: #ff9b85; }
.tk .pr { font-size: 14px; color: var(--kds-soft); }
.tk .tag { justify-self: start; font-size: 11.5px; font-weight: 900; border-radius: 6px; padding: 2px 7px; background: #2b3631; color: #cfe; }
.tk .tag.truck { background: #213a5c; color: #cfe0ff; }
.tk .tag.flag { background: #4a1712; color: #ffb4a8; }
.tk.waiting { border-color: #8a6a12; } .tk.waiting .a b { color: #ffd77a; font-size: 18px; }
.tk .go { margin-top: 6px; text-align: center; font-weight: 900; font-size: 22px; border-radius: 13px; padding: 14px; background: #1f7a45; color: #fff; }
.tk .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.tk .two button { font-weight: 900; font-size: 17px; border-radius: 12px; padding: 13px 4px; background: #2a332e; color: #eef3f0; }
.tk .two button.nv { background: #3a1414; color: #ffb4a8; }
.sold { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.sold button { background: var(--kds-card); border: 1px solid var(--kds-line); color: var(--kds-ink); border-radius: 12px; padding: 12px 4px; font-weight: 900; font-size: 15px; }

.ring { position: fixed; inset: 0; z-index: 40; background: #17703f; color: #fff; display: grid; place-items: center; text-align: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.ring .in { max-width: 380px; display: grid; gap: 8px; }

@keyframes pulse { 50% { opacity: .55; } }

nav.tabs { position: fixed; z-index: 8; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 440px; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }

.msgrow .ch { font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: var(--sunk); color: var(--soft); }

.stars { color: var(--money); letter-spacing: 1px; }
.hint { font-size: 12px; color: var(--soft); }
</style>

    var labor = 0; e.staff.forEach(function (s) { labor += s[2] * (c[s[3]] || 0); });
    return { sub: sub, tax: tax, total: total, paid: paid, rest: total - e.deposit.amount, owedNow: total - paid, food: food, labor: labor, profit: total - food - labor };

    switch (a) {
      case "toggle-mine": S.onlyMine = !S.onlyMine; render(); window.scrollTo(0, 0); break;
      case "close-wait": S.waitBanner = false; render(); break;
      case "noop": toast("Vista de muestra: aquí se abre todo lo del día."); break;
      case "accept": resolveNeed(t.dataset.need, "Aceptado. Le avisamos al cliente que paga al recoger."); break;
      case "decline": resolveNeed(t.dataset.need, "Rechazado. Le avisamos al cliente con su enlace para un pedido más chico."); break;
      case "call": sheet('<h2>Llamar a Memo E.</h2><div class="msg num">(713) 555-0148</div><div class="hint">Su pedido #218 de la 1:00 lleva barbacoa. Ofrézcale otra carne.</div><div class="split"><button class="btn ghost big" data-act="copy-phone" data-v="(713) 555-0148">Copiar número</button><button class="btn go big" data-act="called" data-need="' + t.dataset.need + '">Ya le avisé</button></div>'); break;
      case "called": closeSheet(); resolveNeed(t.dataset.need, "Listo: Memo ya sabe."); break;
      case "remind": case "remind-ev":
        S._needToResolve = t.dataset.need || (S.biz === "rest" ? "r2" : "n3");
        waSheet("Recordar el anticipo", "Hola Rosa, le escribe Taquería Ejemplo. Para apartar el bautizo del sábado 25 (60 personas) nos falta el anticipo de $230. Puede pagarlo en efectivo aquí en el local o por Zelle a pagos@taqueriaejemplo.com. ¡Gracias!", "Ya lo mandé", function () { resolveNeed(S._needToResolve, "Recordatorio mandado. Le avisamos si no paga para el jueves."); });
        break;
      case "copywa": copy($("#wa-text").textContent); break;
      case "wa-done": var fn = S._waDone; closeSheet(); if (fn) fn(); else toast("Listo"); break;
      case "open-event": openEvent(t.dataset.ev); break;
      case "copy-phone": copy(t.dataset.v); break;
      case "pay": paySheet(t.dataset.ev); break;
      case "pay-save":
        var e1 = S.events.filter(function (x) { return x.id === S._pay.ev; })[0]; var amt = +($("#pay-amt").value || 0);
        if (!amt) { toast("Escriba cuánto recibió"); break; }
        if (!e1.deposit.paid) { e1.deposit = { amount: amt, paid: true, how: S._pay.how, by: S._pay.by, date: "19 oct" }; S.needs[S.biz].forEach(function (n) { if (/anticipo/.test(n.t)) n.done = true; }); }
        else { e1.deposit.amount += amt; }
        closeSheet(); toast("Apuntado: " + money(amt) + " por " + S._pay.how.toLowerCase() + " (" + S._pay.by + ")"); render(); break;
      case "prep": prepSheet(); break;
      case "prep-send": waSheet("Mandar a la cocina", "Preparación sábado 25: pastor 27 lb · asada 18 lb · pollo 6 lb · barbacoa 12 lb · tortillas 35 dz · salsa roja 4 qt · verde 4 qt · cebolla y cilantro 3 qt · limones 2 cajas. Bautizo: 1 invitada SIN CACAHUATE.", "Ya lo mandé", function () { toast("Mandado a la cocina"); }); break;
      case "quote": case "quote-q1": quoteSheet(t.dataset.q || "q1"); break;
      case "send-quote":
        var Q = S._q;
        waSheet("Mandar cotización", "Hola, le escribe Taquería Ejemplo. Su " + Q.q.name.split(" · ")[0].toLowerCase() + " para " + Q.people + " personas (" + Q.q.date + "): " + money(S._qTotal) + " en total. Para apartar la fecha, anticipo de " + money(S._qDep) + " (efectivo o Zelle). Conteste \"sí\" y se la apartamos.", "Ya la mandé", function () {
          S.inquiries = S.inquiries.filter(function (x) { return x.id !== Q.q.id; });
          S.needs.rest.forEach(function (n) { if (n.id === "r1") n.done = true; });
          toast("Cotización mandada. Le avisamos cuando conteste."); render();
        }); break;
      case "new-big":
        sheet('<h2>Nuevo pedido grande</h2><div class="hint">Mientras está en el teléfono. Lo demás se llena después.</div><label class="field">Nombre<input id="nb-name" value="Lupe Muestra"></label><label class="field">Teléfono<input id="nb-phone" inputmode="tel" value="(713) 555-0166"></label><div class="split"><label class="field">Fecha<input id="nb-date" value="sáb 15 nov"></label><label class="field">Personas<input id="nb-ppl" type="number" inputmode="numeric" value="35"></label></div><div class="field">Llegó por<div class="chips"><button data-from="llamada" aria-pressed="true">Llamada</button><button data-from="WhatsApp" aria-pressed="false">WhatsApp</button><button data-from="mostrador" aria-pressed="false">Mostrador</button></div></div><button class="btn go big wide" data-act="nb-save">Guardar en "Por cotizar"</button>');
        break;
      case "nb-save":
        S.inquiries.unshift({ id: "q" + Date.now(), name: "Fiesta · " + ($("#nb-name").value || "Sin nombre"), people: +($("#nb-ppl").value || 0), date: $("#nb-date").value || "sin fecha", from: (document.querySelector('[data-from][aria-pressed="true"]') || {}).dataset ? document.querySelector('[data-from][aria-pressed="true"]').dataset.from : "llamada", ago: "ahora" });
        S.bigSeg = "cotizar"; S.tab = "grandes"; closeSheet(); toast("Guardado en \"Por cotizar\""); render(); break;
      case "repeat": toast("Copiado como pedido nuevo en \"Por cotizar\"."); S.inquiries.unshift({ id: "q" + Date.now(), name: "Taquiza · Oficina Ejemplo", people: 45, date: "vie 21 nov", from: "repetido", ago: "ahora" }); render(); break;
      case "tam-give":
        var tm = S.tamales.filter(function (x) { return x.id === t.dataset.t; })[0], owe = tm.total - tm.paid;
        if (owe > 0) sheet('<h2>' + esc(tm.name) + ' · ' + esc(tm.what) + '</h2><div class="msg">Todavía debe <b>' + money(owe) + '</b>. ¿Ya se lo cobró?</div><div class="split"><button class="btn go big" data-act="tam-paid" data-t="' + tm.id + '">Sí, cobré ' + money(owe) + '</button><button class="btn warn big" data-act="tam-owe" data-t="' + tm.id + '">No, sigue debiendo</button></div>');
        else { tm.done = true; toast("Entregado"); render(); }
        break;
      case "tam-paid": var t2 = S.tamales.filter(function (x) { return x.id === t.dataset.t; })[0]; t2.paid = t2.total; t2.done = true; closeSheet(); toast("Cobrado y entregado"); render(); break;
      case "tam-owe": var t3 = S.tamales.filter(function (x) { return x.id === t.dataset.t; })[0]; t3.done = true; closeSheet(); toast("Entregado. Sigue debiendo; queda en su lista."); render(); break;
      case "ready":
        p = findOrder(t.dataset.list, t.dataset.p); p.state = "ready"; p.wait = 0;
        waSheet("Avisar a " + p.name.split(" ")[0], "Taquería Ejemplo: ¡su pedido #" + p.id + " está listo! Pase al mostrador de pedidos, ahí paga (" + money2(p.price) + ").", "Ya le avisé", function () { render(); });
        render(); break;
      case "picked": p = findOrder(t.dataset.list, t.dataset.p); p.state = "gone"; toast("Recogió ✓"); render(); break;
      case "noshow": p = findOrder(t.dataset.list, t.dataset.p); p.state = "gone"; toast("No vino. Si vuelve a pedir, se marca \"no vino " + ((p.noShows || 0) + 1) + " veces\"."); render(); break;
      case "pause": S.status = S.status === "paused" ? "open" : "paused"; toast(S.status === "paused" ? "Pausado 20 min. Se reabre solo a la 1:02." : "Abierto otra vez"); render(); break;
      case "sim-order": ring(); break;
      case "ring-ack": stopRing(); toast("Visto. Ya está en la lista."); S.pickups.push({ id: 220, name: "Memo E.", when: "1:15", items: ["6 campechanos con todo", "2 horchatas"], price: 23.50, state: "new" }); render(); break;
      case "sim-offline": S.offline = !S.offline; toast(S.offline ? "Sin internet: su página se pausó sola y le avisamos a su teléfono." : "Conectado. Su página se reabrió sola."); render(); break;
      case "truck-arrive": S.trucks.arrived = true; toast("Llegamos ✓ Su página y Google ya dicen dónde están."); render(); window.scrollTo(0, 0); break;
      case "truck-late": S.trucks.late = true; waSheet("Avisar que van tarde", "Tacos Ejemplo: vamos 20 minutos tarde a la obra de Bissonnet. Su pedido sale a tiempo de llegar. ¡Perdón!", "Ya avisé a los 3", function () { toast("Avisados los 3 clientes con pedido"); render(); }); break;
      case "truck-move":
        sheet('<h2>¿A dónde se movieron?</h2><div class="chips"><button data-spot="Airline y Tidwell" aria-pressed="false">Airline y Tidwell</button><button data-spot="Shell de Bellaire (atrás)" aria-pressed="false">Shell de Bellaire (atrás)</button><button data-spot="Obra en Westheimer" aria-pressed="false">Obra en Westheimer</button></div><div class="hint">Se cambia en su página y en Google, y les avisamos a los clientes que ya pidieron.</div>'); break;
      case "truck-close": sheet('<h2>¿Hoy no salen?</h2><div class="hint">Su página y Google dirán "cerrado hoy", y les avisamos a los 3 clientes que ya pidieron.</div><div class="split"><button class="btn warn big" data-act="truck-close-yes">Sí, hoy no salimos</button><button class="btn ghost big" data-close="1">No, sí salimos</button></div>'); break;
      case "truck-close-yes": S.trucks.closed = true; closeSheet(); render(); break;
      case "truck-reopen": S.trucks.closed = false; render(); break;
      case "truck-post": waSheet("Publicar en todo", "📍 Hoy, " + (S.trucks.spot || "Obra en Bissonnet") + " de 10:30 a 2:00, y en la noche en el bar de 8:00 a 1:00. Pida por adelantado: [su enlace]", "Ya lo publiqué", function () { toast("Publicado"); }); break;
      case "letter": resolveNeed(t.dataset.need, "Carta del baño del bar apuntada ✓"); break;
      case "go-troca": S.trucks.arrived = true; S.tab = "troca"; resolveNeed(t.dataset.need); break;
      case "msg-to-big": var m0 = S.messages[+t.dataset.m]; S.inquiries.unshift({ id: "q" + Date.now(), name: "Quince · " + m0.who, people: 150, date: "sáb 13 dic", from: "Instagram", ago: "hace 3 h" }); m0.conv = false; m0.tag = "Convertido en pedido grande"; toast("Ya está en \"Por cotizar\""); render(); break;
      case "reply-review":
        S._rv = t.dataset.r; sheet('<h2>Responder a Jorge (★★)</h2><label class="field">Respuesta (ya escrita, cámbiela si quiere)<textarea id="rv-text" rows="5">Jorge, gracias por decirnos. Tiene razón: el viernes se nos juntaron los pedidos y tardamos. Ya ajustamos cuántos pedidos tomamos por hora para que no vuelva a pasar. La próxima vez pregunte por Martha y se la invitamos.</textarea></label><div class="split"><button class="btn ghost big" data-act="rv-copy">Copiar</button><button class="btn go big" data-act="rv-done">Publicar respuesta</button></div>'); break;
      case "rv-copy": copy($("#rv-text").value); break;
      case "rv-done": if (S.reviews[0]) S.reviews[0].answered = true; S.needs.rest.forEach(function (n) { if (n.id === "r3") n.done = true; }); closeSheet(); toast("Respuesta lista para publicar en Google"); render(); break;
      case "lockcount": resolveNeed(t.dataset.need, "Número cerrado: 120 personas. La lista de preparación ya lo usa."); break;
    }
    if (t.dataset.spot) { S.trucks.spot = t.dataset.spot; closeSheet(); toast("Cambiado a " + t.dataset.spot + ". Avisamos a los 3 clientes con pedido."); render(); }
    if (t.dataset.from) { document.querySelectorAll("[data-from]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === t)); }); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.cost) { var v = parseFloat(t.value); if (!isNaN(v)) { S.costs[t.dataset.cost] = v; toast("Costos guardados. La ganancia de cada evento se recalculó."); } }
    if (t.dataset.eq) { var parts = t.dataset.eq.split(":"); var e1 = S.events.filter(function (x) { return x.id === parts[0]; })[0]; e1.equip[+parts[1]][1] = t.checked; }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "tam-q") { S.tamQ = e.target.value; var pos = e.target.selectionStart; render(); var i = $("#tam-q"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (ringTimer) stopRing(); else closeSheet(); } });

  render();
})();
</script>
