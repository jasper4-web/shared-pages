<style>
/* Phone skin: light, readable outdoors, no motion, the phone's own font. */
:root{color-scheme:only light;
--bg:#F3F5F9;--panel:#FFFFFF;--panel2:#F2F4F8;--ink:#0B1220;--mut:#343C4C;--dim:#5A6273;
--line:rgba(11,18,32,.12);--line2:rgba(11,18,32,.28);
--brand:#253993;--brand-down:#1B2A70;--tint:#EDF0F9;--tint2:#DADEEF;--focus:#4F6BE0;
--held:#F6F1E8;--held-line:#D9CDB8;--held-edge:#8A6D3B;--held-ink:#5E4720;
--far:#8A5A12;--far-bg:#FBF3E6;--far-line:#E3C894;--bad:#B42318;--bad-bg:#FEF3F2;--ok:#067647;--ok-bg:#ECFDF3;
--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--font);letter-spacing:-.01em;line-height:1.15}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
/* top bar (the preview's .m-top) */
#top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 14px 8px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;border:0;padding:0}
#top .av{width:44px;height:44px;font-size:14px}
.who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.who b{font-size:16px}
.who small{font-size:13.5px;color:var(--dim);font-weight:600}
.topbtns{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px}
.addbtn{height:44px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:15px;padding:0 14px}
/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#nav .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--dim);position:relative;padding:0;letter-spacing:-.01em}
#nav button svg{width:23px;height:23px}
#nav button[aria-current=page]{color:var(--brand)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:flex;align-items:center;justify-content:center}

main{padding:12px 14px 20px}
.boot{padding:40px 0;text-align:center;color:var(--dim)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 10px}
.hrow>div small{display:block;margin-top:3px}
.hrow h2{font-size:21px}
.hrow small{font-size:14px;color:var(--dim);font-weight:600}
/* day chips */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line2);background:var(--panel);border-radius:12px;padding:6px 12px;min-height:50px;min-width:58px;font-weight:650;font-size:14px;line-height:1.15;text-align:center}
.chip small{display:block;font-size:12px;color:var(--dim);font-weight:600}
.chip .n{display:block;font-size:11.5px;font-weight:700;color:var(--brand);margin-top:1px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed=true] small,.chip[aria-pressed=true] .n{color:#DADEEF}
/* next-up card */
.next{background:var(--brand);color:#fff;border-radius:16px;padding:13px 14px 12px;margin-bottom:14px}
.next .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#C9D0EE}
.next b{display:block;font-size:19px;margin-top:3px;line-height:1.2}
.next span{display:block;font-size:14.5px;color:#E3E7F6;margin-top:2px}
.next .acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.next .acts4 a,.next .acts4 button{min-height:52px;border-radius:11px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:650;font-size:12px;white-space:nowrap;letter-spacing:-.01em;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none}
.next .acts4 svg{width:19px;height:19px}
/* job cards (the preview's .m-ev) */
.ev{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:11px 13px}
.ev .t{font-size:13px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev .j{display:block;font-weight:700;font-size:17px;margin-top:2px}
.ev .c{display:block;font-size:14.5px;color:var(--mut);margin-top:1px}
.ev.far{border-left-color:var(--far)}
.ev.far .t{color:var(--far)}
.ev.wait{border-style:dashed;border-left-style:solid;background:#FCFCFE}
.ev.done{opacity:.72}
.ev.gone{background:var(--panel2);border-style:dashed;border-left-style:dashed;border-left-color:rgba(11,18,32,.35)}
.ev.gone .t,.ev.gone .j,.ev.gone .c{color:var(--dim)}
.ev.gone .j{text-decoration:line-through}
/* held / closed time (the preview's .m-ev.held) */
.ev.held{background:var(--held);border-color:var(--held-line);border-left-color:var(--held-edge)}
.ev.held .t{color:var(--held-ink)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:3px 8px;text-transform:none}
.pill.far{background:var(--far-bg);color:var(--far);border:1px solid var(--far-line)}
.pill.wait{background:var(--tint);color:var(--brand)}
.pill.es{background:#EEF6EE;color:#1E6B34;border:1px solid #BFDCC4}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.gap{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;font-weight:600;padding:5px 0 5px 14px}
.gap:before{content:"";width:2px;height:18px;background:var(--line2);border-radius:2px}
.gap.bad{color:var(--bad)}
.list{display:flex;flex-direction:column}
.note-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;color:var(--mut);margin-bottom:10px}
.note-box b{color:var(--ink)}
.daybtn{width:100%;margin-top:14px}
.empty,.failcard{background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:20px 16px;text-align:center;color:var(--mut)}
.empty b,.failcard b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin:12px auto 0}
.failcard{border-color:#F2C1BC;background:var(--bad-bg)}
.stale{font-size:13px;color:var(--dim);margin:-4px 2px 10px}
.nudge{display:flex;gap:10px;align-items:center;background:var(--tint);border:1px solid var(--tint2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.nudge button{margin-left:auto;background:none;border:0;font-weight:700;color:var(--brand);min-width:48px;min-height:44px;flex:none}
.nudge button+button{margin-left:0;color:var(--dim);font-weight:600}
/* cards (the preview's .m-card / .m-f) */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.person{display:flex;align-items:center;gap:11px}
.in{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:none}
.person b{display:block;font-size:17px;line-height:1.25}
.person small{display:block;font-size:14px;color:var(--mut);line-height:1.3}
.f{margin-top:8px}
.f div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.f dt{color:var(--mut);flex:none}
.f dd{font-weight:650;text-align:right}
.note{font-size:14px;color:var(--mut);margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel);font-weight:700;font-size:15.5px;text-decoration:none;color:var(--ink);padding:0 12px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad);border-color:#F2C1BC}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ok{color:var(--ok);border-color:#ABEFC6}
.btn[disabled]{opacity:.55}
.btn.wide{width:100%;margin-top:10px}
.act{flex-direction:column;gap:3px;font-size:13.5px;min-height:62px}
.search,.in-f{width:100%;min-height:50px;border:1.5px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;background:var(--panel)}
.search{margin-bottom:12px}
textarea.in-f{padding:12px 14px;min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:.8fr 1fr 1fr;gap:9px}
.fl{display:block;font-size:13.5px;font-weight:650;color:var(--mut);margin:10px 2px 5px}
.rv{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;min-height:56px}
.rv .person{flex:1;min-width:0}
.rv.sel{border:2px solid var(--brand);background:var(--tint)}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.hist span{white-space:nowrap}
.card>.hist:first-child,.card>.hist:first-of-type{border-top:0}
.hist span{color:var(--mut)}
.hist em{font-style:normal;font-weight:650;font-size:13px;color:var(--dim)}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jobs button{min-height:50px;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel);font-weight:650;font-size:14.5px;padding:6px 8px;line-height:1.2}
.jobs button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.switch{display:flex;align-items:center;gap:10px;margin:12px 2px 2px;font-size:15px;font-weight:600}
.switch input{width:24px;height:24px;accent-color:var(--brand)}
.choice{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.choice a{display:block;background:var(--panel);border:1.5px solid var(--line2);border-radius:12px;padding:13px 14px;text-decoration:none;color:var(--ink)}
.choice a b{display:block;font-size:16px}
.choice a span{display:block;font-size:14px;color:var(--mut);margin-top:2px}
/* bottom sheet */
.sheet-layer{position:fixed;inset:0;z-index:20;background:rgba(11,18,32,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:6px 14px calc(18px + var(--safe-b))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:6px auto 8px}
.sheet h3{font-size:20px;margin:2px 2px 2px}
.sheet .sub{color:var(--mut);font-size:14.5px;margin:0 2px 10px}
.sheet .close{float:right;background:none;border:0;font-weight:700;color:var(--brand);min-height:44px;min-width:64px}
.ask{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px;margin-top:12px}
.ask p{font-size:15px;margin-bottom:10px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.times button{min-height:46px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel);font-weight:650}
.times button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.lbl{font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:12px 2px 6px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-start;padding:calc(56px + var(--safe-t)) 22px 24px;max-width:420px;margin:0 auto}
.login .av{width:56px;height:56px;font-size:19px;margin-bottom:14px}
.login h1{font-size:28px}
.login p{color:var(--mut);margin:6px 0 18px}
.login .help{font-size:14px;color:var(--dim);margin-top:14px;text-align:center}
.pin{width:100%;min-height:58px;font-size:26px;letter-spacing:.4em;text-align:center;border:1.5px solid var(--line2);border-radius:14px;background:var(--panel);margin-bottom:12px}
.err{color:var(--bad);font-weight:600;font-size:14.5px;min-height:22px;margin-bottom:6px}
/* List / Day switch */
.seg{display:flex;flex:none;gap:2px;padding:3px;background:var(--panel);border:1.5px solid var(--line2);border-radius:12px}
.seg button{min-height:40px;min-width:58px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14.5px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
/* Day view (the preview's example day): time down the left, jobs sized by length */
.gridwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 10px 16px 0}
.grid{position:relative}
.hl{position:absolute;left:50px;right:0;height:0;border-top:1px solid var(--line)}
.hl span{position:absolute;left:-50px;top:-9px;width:42px;text-align:right;font-size:12.5px;font-weight:650;line-height:18px;color:var(--dim)}
.lane{position:absolute;left:56px;right:0;top:0;bottom:0}
.gi{position:absolute;left:0;width:100%;display:flex;flex-direction:column;padding:5px 10px;border:0;border-radius:9px;text-align:left;overflow:hidden;color:var(--ink)}
button.gi:active{filter:brightness(.94)}
.gt{display:block;font-weight:700;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs{display:block;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-in{font-weight:500;font-size:13px}
.gi.job{background:var(--brand);color:#fff;z-index:3}
.gi.job .gs,.gi.job .gs-in{color:#DCE1F5}
.gi.job.wait{background:var(--tint);color:var(--brand);border:1.5px dashed var(--brand)}
.gi.job.wait .gs,.gi.job.wait .gs-in{color:var(--mut)}
.gi.sm{padding:3px 10px}
.gi.sm .gt{font-size:14px;line-height:1.2}
.gi.sm .gs{font-size:12.5px;line-height:1.25}
.gi.slack{z-index:1;justify-content:center;background:var(--panel);border:1px dotted var(--line2);color:var(--dim)}
.gi.slack .gs{font-weight:600;font-size:12.5px}
.gi.job.done{background:#8B95C6}
.gi.drive{z-index:1;background:repeating-linear-gradient(135deg,rgba(11,18,32,.08) 0 5px,transparent 5px 11px),var(--panel2);border:1px solid var(--line);color:var(--dim)}
.gi.drive .gs{font-weight:600;font-size:12.5px}
.gi.open{z-index:2;background:var(--panel);border:1.5px dashed var(--line2)}
.gi.open .gs,.gi.open .gs-in{color:var(--brand);font-weight:650}

  /* ------------------------------------------------ the guide */
  function guide() {
    var t = M.ticks() || {}, n = count(), info = M.info();
    var out = '<h3 class="px-h">Practice copy</h3><p class="px-sub">' + esc(info.business) + " is a made-up shop. Try anything: what you change stays on this phone, and no one gets a call, a text or an email.</p>";
    if (!info.saved) out += '<p class="px-warn">This browser isn\'t keeping anything, so a reload starts fresh. A normal (not private) window keeps your practice.</p>';
    out += '<div class="px-lbl"><span>Try this</span><span class="px-count">' + n + " of " + TRY.length + '</span></div><div class="px-bar" aria-hidden="true"><i style="width:' + Math.round(n / TRY.length * 100) + '%"></i></div>';
    out += '<div class="px-card">' + TRY.map(function (x) {
      var done = !!t[x[0]];
      return '<div class="px-try' + (done ? " done" : "") + '" data-try="' + x[0] + '"><span class="px-tick">' + (done ? I.check : "") + '</span><span class="px-tt"><b>' + esc(x[1]) + "</b>" +
        "<small>" + esc(done ? "Done" : x[2]) + "</small></span>" + '<span class="px-sr">' + (done ? "done" : "not yet") + "</span></div>";
    }).join("") + "</div>";
    out += '<div class="px-lbl"><span>What this practice copy can\'t show</span></div><div class="px-card">' +
      CANT.map(function (x) { return '<div class="px-cant"><b>' + esc(x[0]) + "</b><small>" + esc(x[1]) + "</small></div>"; }).join("") + "</div>";
    out += '<p class="px-foot">Call, Text and Directions show what would open on the owner\'s phone, instead of opening yours.</p>';
    out += asking ? '<div class="px-ask"><p>Start over? Your bookings, customers, notes and ticks here are wiped, and a fresh sample week is made around today.</p>' +
        '<div class="px-row2"><button class="px-btn" data-px="keep">Keep my practice</button><button class="px-btn px-danger" data-px="reset">Yes, start over</button></div></div>'
      : '<button class="px-btn px-wide" data-px="ask-reset">Start over with fresh sample data</button>';
    out += '<p class="px-made">Sample week made ' + esc(dayLabel(info.madeDay)) + "." + (info.madeDay !== info.today ? " Start over to get a fresh week around today." : "") + "</p>";
    return out;
  }
  function open(kind, html) {
    var keep = view === kind && !layer.hidden && layer.firstChild ? layer.firstChild.scrollTop : 0;
    view = kind;
    layer.innerHTML = '<div class="px-sheet" role="dialog" aria-modal="true" aria-label="' + (kind === "guide" ? "Practice copy guide" : "Practice copy") + '"><div class="px-grab"></div>' +
      '<button class="px-close" type="button" data-px="close">Close</button>' + html + "</div>";
    layer.hidden = false;
    layer.firstChild.scrollTop = keep;

  }
  function close() { layer.hidden = true; layer.innerHTML = ""; view = null; asking = false; place(); }
  function showGuide() { open("guide", guide()); }

  pill.addEventListener("click", function () { asking = false; showGuide(); });
  layer.addEventListener("click", function (e) {
    if (e.target === layer) return close();

  /* ------------------------------------------------ taps that would leave the page: say what the real app does */
  function info(title, html) { return '<h3 class="px-h">' + esc(title) + "</h3>" + html + '<button class="px-btn px-primary px-wide" data-px="ok">OK</button>'; }

    else if (/^https:\/\/maps\.apple\.com\//i.test(href)) html = info("Directions", '<p class="px-sub">On the owner\'s phone, this opens Maps with driving directions to <b>' + esc(param(href, "daddr")) + "</b>.</p><p class=\"px-mute\">The practice addresses are made up.</p>");
    else if (/^data:image\//i.test(href)) html = '<h3 class="px-h">Job photo</h3><img class="px-photo" alt="Job photo" src="' + esc(href) + '"><button class="px-btn px-primary px-wide" data-px="ok">OK</button>';
    else if (/^[a-z][a-z0-9+.-]*:/i.test(href) && !/^javascript:/i.test(href)) html = info("Not in the practice copy", '<p class="px-sub">This link would leave the practice copy.</p>');

    e.preventDefault(); e.stopImmediatePropagation();

  }, true);

  /* ------------------------------------------------ the pill: above the tab bar, above a message, away when a sheet is up */
  function place() {
    var sheet = $("sheet"), toast = $("toast");
    pill.hidden = !layer.hidden || !!(sheet && !sheet.hidden);
    var lift = 0;
    if (toast && !toast.hidden && !/\btop\b/.test(toast.className)) { var r = toast.getBoundingClientRect(); if (r.height) lift = Math.ceil(window.innerHeight - r.top + 10); }
    pill.style.bottom = lift ? lift + "px" : "";
  }
  /* a scan here gives a sample: say so inside the sheet that shows it */
  function scanNote() {
    if (!scanned) return;
    var L = $("sheet");
    if (!L || L.hidden) { scanned = null; return; }

    var sub = sh.querySelector(":scope > .sub");

  var mo = new MutationObserver(function () { place(); scanNote(); });
  ["sheet", "toast"].forEach(function (id) { var el = $(id); if (el) mo.observe(el, { attributes: true, attributeFilter: ["hidden", "class"], childList: true }); });
  window.addEventListener("resize", place);
  window.addEventListener("practice:scan", function (e) { scanned = { kind: (e.detail && e.detail.kind) || "vin", shown: false }; scanNote(); });
  window.addEventListener("practice:tick", function () {
    paintPill();
    if (count() < TRY.length) { pill.classList.add("px-flash"); clearTimeout(flashT); flashT = setTimeout(function () { pill.classList.remove("px-flash"); }, 1800); }
    if (view === "guide" && !layer.hidden) showGuide();
  });
  paintPill(); place();
})();

</script>
<script>

(function () {
  "use strict";
  var C = window.APP_CONFIG || {};
  var TZ = C.timezone || "America/Chicago";

  function $(id) { return document.getElementById(id); }

  function dowNum(d) { return new Date(d + "T12:00:00Z").getUTCDay(); }
  function isWork(d) { return WORK.indexOf(dowNum(d)) >= 0; }
  function workDays(from, n) { var out = [], d = from; for (var i = 0; out.length < n && i < 40; i++) { if (isWork(d)) out.push(d); d = addDays(d, 1); } return out; }
  function dayLabel(d, long) { return new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: long ? "long" : "short", month: "short", day: "numeric" }); }

  function dnum(d) { return new Date(d + "T12:00:00Z").getUTCDate(); }

  function monthName(ym) { return new Date(ym + "-15T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", month: "long", year: "numeric" }); }
  function addMonths(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + "-" + (m < 9 ? "0" : "") + (m + 1); }
  function plusMonths(d, n) { var ym = addMonths(d.slice(0, 7), n), last = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate(); return ym + "-" + ("0" + Math.min(+d.slice(8), last)).slice(-2); }
  function dateOf(ms) { return new Date(ms).toLocaleDateString("en-CA", { timeZone: TZ }); }
  function fmtTime(ms) { return new Date(ms).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).replace(/\s(AM|PM)$/, "\u00a0$1"); }

  function fmtGap(m) { if (m < 60) return m + " min"; var h = Math.floor(m / 60), r = m % 60; return h + " hr" + (r ? " " + r + " min" : ""); }

  function u8(b64) { var p = b64.split("-").join("+").split("_").join("/"); while (p.length % 4) p += "="; var raw = atob(p), a = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i); return a; }
  function checkBuzz() {
    if (!pushOk()) { S.buzz = null; return; }
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) { var on = !!sub; if (S.buzz !== on) { S.buzz = on; if (!S.sheet || S.sheet.kind === "settings") render(); } }).catch(function () {});
  }
  function buzzOn() {
    if (!pushOk()) return toast(ios() ? "On iPhone: Share, then Add to Home Screen. Open the app from there and try again." : "This browser can't buzz.", true);

    Notification.requestPermission().then(function (perm) {

      return Promise.all([navigator.serviceWorker.ready, api("/api/push/key")]);
    }).then(function (x) {
      if (!x[1].key) throw new Error("Buzz isn't set up on the server yet.");
      return x[0].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(x[1].key) });
    }).then(function (sub) {
      var j = sub.toJSON(); return api("/api/push/subscribe", { method: "POST", body: { endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth } });
    }).then(function () { return api("/api/push/test", { method: "POST", body: {} }); }).then(function () {
      S.busy.buzz = false; S.buzz = true; render(); toast("Buzz is on. A test one is on its way.");
    }).catch(function (e) { S.busy.buzz = false; render(); if (!e.silent) toast(e.message, true); });
  }
  function buzzOff() {

      if (!sub) return;
      return api("/api/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } }).then(function () { return sub.unsubscribe(); });
    }).then(function () { S.busy.buzz = false; S.buzz = false; render(); toast("Buzz is off on this phone."); })
      .catch(function (e) { S.busy.buzz = false; render(); if (!e.silent) toast(e.message, true); });
  }

  }
  function openSheet(s) { S.sheet = s; S.arm = null; $("toast").hidden = true; renderSheet(true); }
  function closeSheet() { S.sheet = null; renderSheet(); }
  function renderSheet(fresh) {
    var L = $("sheet");
    if (!S.sheet) { L.hidden = true; L.innerHTML = ""; return; }
    var old = L.querySelector(".sheet"), keep = !fresh && old ? old.scrollTop : 0;
    var kind = S.sheet.kind;
    var body = kind === "job" ? jobSheet(S.sheet) : kind === "move" ? moveSheet(S.sheet) : kind === "text" ? textSheet(S.sheet) : kind === "add" ? addSheet(S.sheet) :

    wireIn(L); wireAdd(L); wireGap(L); wireRem(L); wireNotes(L); wireForms(L);
  }

    }
    if (a === "decline") return write("req-" + id, "/api/job/" + id + "/decline", {}, function () { toast("Declined. They get an email."); afterChange(); });
    if (a === "cancel") return write("job-" + id, "/api/job/" + id + "/cancel", {}, function () { toast("Cancelled. They get an email."); afterChange(); });
    if (a === "done") return write("job-" + id, "/api/job/" + id + "/done", {}, function (d) {
      afterChange(); loadReviews();
      var who = d.first || "the customer";
      toast(d.review === "queued" ? "Marked done. Review ask goes to " + who + " in 10 minutes." : d.review === "noemail" ? "Marked done. No email on file, so no review ask." :
        d.review === "notype" ? "Marked done. No review ask after this kind of job." :
        d.review === "recent" ? "Marked done. " + who + " was asked for a review recently." : "Marked done.", false,
        { label: "Undo", fn: function () { api("/api/job/" + id + "/undone", { method: "POST", body: {} }).then(function () { toast("Undone. No review ask."); afterChange(); loadReviews(); }).catch(function (e) { if (!e.silent) toast(e.message, true); }); } });
    });
    if (a === "close" || a === "reopen") {
      var date = S.date;
      return write("day-" + date, "/api/" + a, { date: date }, function (d) {
        if (S.sheet && S.sheet.kind === "block") closeSheet();
        var whole = d.from && fmtTime(d.from) === clock((C.hours || {}).start || "08:00");
        toast(a === "close" ? (d.already ? "Already closed." : whole ? "Closed all day. Online booking won't offer it." : "Closed" + (d.from ? " from " + fmtTime(d.from) : "") + ". Online booking won't offer those times.") :
          "Reopened. Online booking is open again." + (d.others ? " (Time blocked in another app stays blocked.)" : ""));
        loadDay(date, true).catch(function () {}); loadRange();
      });
    }
  }
  function custRevAsk(id) {
    var s = S.sheet, k = "crev-" + id; if (!s || !s.data || S.busy[k]) return;
    if (S.arm !== k) return armIt(k, renderSheet);      // two taps before an email goes to a customer
    if (Date.now() - S.armAt < 600) return;              // a bounce or a double-tap isn't a second tap
    var last = s.data.lastAsk || 0, again = !!(last && Date.now() - last < 30 * 86400000);
    S.arm = null; S.busy[k] = true; renderSheet();
    api("/api/customer/" + id + "/review", { method: "POST", body: { again: again } }).then(function (d) {
      S.busy[k] = false; var first = s.data.customer.first || "them";
      if (d.state === "asked") { s.data.lastAsk = d.last; toast("Review ask sent to " + first + " by email."); if (S.tab === "home" || S.tab === "reminders") loadReviews(); }
      else { if (d.state === "recent" && d.last) s.data.lastAsk = d.last; toast(d.state === "noemail" ? "No email on file, so it can't be sent." : d.state === "recent" ? first + " was asked in the last 30 days." : "Done.", d.state !== "asked"); }
      if (S.sheet === s) renderSheet();
    }).catch(function (e) { S.busy[k] = false; if (S.sheet === s) renderSheet(); if (!e.silent) toast(e.message, true); });
  }
  function remSave() {
    var s = S.sheet; if (!s || s.kind !== "rem" || S.busy.remsave) return;
    if (!(s.title || "").trim()) return toast("Write what to remember.", true);
    S.busy.remsave = true; renderSheet();
    api("/api/reminders", { method: "POST", body: { title: s.title.trim(), date: s.date, contactId: s.contactId || "" } }).then(function (d) {
      S.busy.remsave = false; S.remAdded[d.reminder.id] = { r: d.reminder, t: Date.now() };
      closeSheet(); render(); toast("Reminder saved for " + (s.date === todayStr() ? "today" : dayLabel(s.date)) + ".");
    }).catch(function (e) { S.busy.remsave = false; renderSheet(); if (!e.silent) toast(e.message, true); });
  }
  function write(key, path, body, done) {
    if (S.busy[key]) return;
    S.busy[key] = true; render();
    api(path, { method: "POST", body: body }).then(function (d) { S.busy[key] = false; S.ask = null; done(d); render(); })
      .catch(function (e) { S.busy[key] = false; render(); if (!e.silent) toast(e.message, true); });
  }
  function afterChange() {
    closeSheet(); S.day = {}; S.mrange = {}; loadDay(S.date, true).catch(function () {}); loadRequests(true).catch(function () {}); loadRange();
    if (S.date !== todayStr()) loadDay(todayStr(), true).catch(function () {});
    if (S.tab === "schedule" && S.view === "month") loadMonth();
  }
  function doMove(force) {
    var s = S.sheet, j = findJob(s.id); if (!j || !s.time) return;
    var key = "mv-" + j.id; if (S.busy[key]) return;
    S.busy[key] = true; renderSheet();
    api("/api/job/" + j.id + "/move", { method: "POST", body: { date: s.date, time: s.time, force: force } }).then(function () {
      S.busy[key] = false; toast("Moved to " + dayLabel(s.date) + ", " + clock(s.time) + ". They get an email."); afterChange();
    }).catch(function (e) {
      S.busy[key] = false;
      if (e.data && e.data.conflict) { s.conflict = e.message; renderSheet(); } else { renderSheet(); if (!e.silent) toast(e.message, true); }
    });
  }
  function openJob(id) {
    S.ask = null; S.arm = null; openSheet({ kind: "job", id: id });
    loadNotes(id);
    var j = findJob(id); if (j && j.status === "showed") loadReviews();
  }
  function openCustomer(id, o) {
    if (!id) return;
    var pre = o && o.data;
    openSheet({ kind: "cust", id: id, revFirst: !!(o && o.revFirst), data: pre || null, prelim: !!pre });     // a just-saved customer shows at once
    function mine() { return S.sheet && S.sheet.kind === "cust" && S.sheet.id === id; }
    api("/api/customer/" + id).then(function (d) {
      if (!mine()) return;
      S.sheet.data = d; S.sheet.err = null; S.sheet.prelim = false; S.sheet.loadErr = null; renderSheet();
      return api("/api/customer/" + id + "/notes").then(function (n) {      // notes fill in a moment later
        if (!(mine() && S.sheet.data)) return;
        var any = false; (S.sheet.data.jobs || []).forEach(function (j) { if (n.notes[j.id]) { j.notes = n.notes[j.id]; any = true; } });
        if (any) renderSheet();
      }).catch(function () {});
    }).catch(function (e) {
      if (!mine() || e.silent) return;
      if (S.sheet.prelim) S.sheet.loadErr = e.message; else S.sheet.err = e.message;      // a failed load never looks like an empty card
      renderSheet();
    });
  }

  /* ------------------------------------------------------------ loading */
  function loadDay(date, force) {
    if (!force && S.day[date] && !S.day[date].stale && Date.now() - S.day[date].savedAt < 30000) return Promise.resolve();
    return api("/api/day?date=" + date).then(function (d) {
      d.savedAt = Date.now(); S.day[date] = d; S.dayErr[date] = null;
      if (!d.partial) lsSet("fa-day-" + date, JSON.stringify(d));       // never keep a half-loaded day for offline
      else if (!S.retried[date] || Date.now() - S.retried[date] > 60000) { S.retried[date] = Date.now(); setTimeout(function () { loadDay(date, true).catch(function () {}); }, 4000); }   // a customer didn't load: try once more by itself
      if (S.tab === "schedule" || (S.tab === "home" && date === todayStr())) render();
    }).catch(function (e) {
      if (e.silent) return;
      if (!S.day[date]) { var cached = lsGet("fa-day-" + date); if (cached) { try { var c = JSON.parse(cached); c.stale = true; S.day[date] = c; } catch (x) {} } }
      else S.day[date].stale = !!e.offline;
      S.dayErr[date] = e.message; if (S.tab === "schedule" || (S.tab === "home" && date === todayStr())) render();
      throw e;
    });
  }
  function loadRange() {
    return api("/api/range?from=" + todayStr() + "&days=15").then(function (d) { S.range = d; if ((S.tab === "schedule" || S.tab === "home") && !S.sheet) render(); }).catch(function () {});
  }
  function loadMonth(force) {
    var ym = S.month; if (!ym || (!force && S.mrange[ym])) return;
    api("/api/range?from=" + monthStart(ym) + "&days=42").then(function (d) { S.mrange[ym] = d; S.mErr[ym] = null; if (S.tab === "schedule" && S.view === "month" && !S.sheet) render(); })
      .catch(function (e) { if (e.silent) return; S.mErr[ym] = e.message; if (S.tab === "schedule" && S.view === "month") render(); });
  }
  function loadRequests(force) {
    if (!force && S.reqs && Date.now() - (S.reqsAt || 0) < 30000) return Promise.resolve();
    return api("/api/requests").then(function (d) { S.reqs = d.requests; S.reqsAt = Date.now(); S.reqErr = null; if (S.tab === "customers") renderNav(); else render(); })
      .catch(function (e) { if (!e.silent) { S.reqErr = e.message; if (S.tab === "requests") render(); else renderNav(); } throw e; });
  }
  function loadReminders() {
    return api("/api/reminders").then(function (d) { S.rems = d.reminders; S.remErr = null; if (!S.sheet) render(); else renderNav(); })
      .catch(function (e) { if (!e.silent) { S.remErr = e.message; if (S.tab === "reminders" && !S.sheet) render(); } });
  }
  function loadReviews() {
    return api("/api/reviews").then(function (d) { S.revs = d.reviews; S.revLink = d.link; S.revSent = d.sent; S.revErr = null; if ((S.tab === "reminders" || S.tab === "home") && !S.sheet) render(); else if (S.sheet && S.sheet.kind === "job") { var rl = $("sheet").querySelector(".revline"), j = findJob(S.sheet.id); if (rl && j) rl.outerHTML = reviewLine(j); wireIn($("sheet")); } })
      .catch(function (e) { if (!e.silent) { S.revErr = e.message; if (S.tab === "reminders" && !S.sheet) render(); } });
  }
  function loadCustomers() {
    S.custErr = null;
    var my = ++S.seq, q = S.q || "";
    function paint() { var box = $("cres"); if (S.tab !== "customers") return; if (box) { box.innerHTML = custResults(); wireIn(box); } else render(); }
    return api("/api/customers?q=" + encodeURIComponent(q)).then(function (d) { if (my !== S.seq) return; S.custs = d.customers; paint(); })
      .catch(function (e) { if (my !== S.seq || e.silent) return; S.custErr = e.message; paint(); });
  }
  function load() {
    if (S.tab === "home") { loadDay(todayStr()).catch(function () {}); if (!S.range) loadRange(); if (!S.revs) loadReviews(); }
    if (S.tab === "schedule") { loadDay(S.date || todayStr()).catch(function () {}); if (!S.range) loadRange(); if (S.view === "month") loadMonth(); }
    if (S.tab === "requests") loadRequests().catch(function () {});
    if (S.tab === "customers" && !S.custs) loadCustomers();
    if (S.tab === "reminders") { loadReminders(); loadReviews(); }
  }
  function refresh(manual) {
    var before = S.date; anchorDate();
    if (before !== S.date && S.tab === "schedule") render();
    var jobs = [loadRequests(true)];
    loadReminders();
    if (S.tab === "reminders") loadReviews();
    if (S.tab === "schedule") { jobs.push(loadDay(S.date, true)); loadRange(); if (S.view === "month") loadMonth(true); }
    if (S.tab === "home") { jobs.push(loadDay(todayStr(), true)); loadRange(); if (manual) loadReviews(); }
    if (S.tab === "customers" && manual) loadCustomers();
    return Promise.all(jobs).then(function () { if (manual) toast("Updated."); })
      .catch(function (e) { if (manual && !e.silent) toast(e.offline ? "Couldn't refresh. No connection." : "Couldn't refresh: " + e.message, true); });
  }
  function go(h) {         // "#requests", "#reminders", "#day=2026-10-08": where a buzz should land
    h = String(h || "").replace(/^.*#/, "");
    if (h === "home" || h === "requests" || h === "reminders" || h === "customers") S.tab = h;
    else if (/^day=\d{4}-\d{2}-\d{2}$/.test(h)) { S.tab = "schedule"; S.date = h.slice(4); if (S.view === "month") S.view = S.pick; }
    else return false;
    try { history.replaceState(null, "", "/"); } catch (e) {}
    return true;
  }
  function start() {
    pickers(); go(location.hash); anchorDate();
    render(); loadDay(S.date, true).catch(function () {}); loadRequests(true).catch(function () {}); loadRange(); loadReminders(); checkBuzz();
    if (S.date !== todayStr()) loadDay(todayStr(), true).catch(function () {});      // Home shows today even on a day off
    if (S.tab === "reminders" || S.tab === "home") loadReviews();
    if (S.tab === "schedule" && S.view === "month") { S.month = S.month || S.date.slice(0, 7); loadMonth(); }
  }

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sheet) closeSheet(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.token && !S.sheet) refresh(false); });
  setInterval(function () { if (!document.hidden && S.token && !S.sheet && S.tab !== "customers") refresh(false); }, 60000);
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
    navigator.serviceWorker.addEventListener("message", function (e) { if (e.data && e.data.go && S.token && go(e.data.go)) { closeSheet(); render(); load(); } });
  }
  window.addEventListener("hashchange", function () { if (S.token && go(location.hash)) { closeSheet(); render(); load(); } });
  if (S.token) start(); else renderLogin();
})();

</script>
</body>
</html>
